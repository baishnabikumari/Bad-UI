<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clawboard</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎹</text></svg>">
</head>

<body>
    <main>
        <h1>Clawboard</h1>
        <p class="sub">grab a note. drop it. the machine plays.</p>

        <div class="machine">
            <div class="hint" id="hint">arrows / A·D to move - space to drop</div>
            <canvas id="game" width="900" height="600"></canvas>
        </div>

        <div class="controls">
            <button id="btn-left" class="pad">&larr;</button>
            <button id="btn-drop" class="pad drop">DROP</button>
            <button id="btn-right" class="pad">&rarr;</button>
        </div>
        <div class="scale-picker">
            <span class="seq-name">SCALE</span>
            <select id="scale-select" class="pad scale-select">
                <option value="major">Major</option>
                <option value="minor">Minor</option>
                <option value="chromatic">Chromatic</option>
            </select>
        </div>
        <div class="sequencer">
            <div class="seq-top">
                <button id="seq-play" class="pad seq-play">PLAY</button>
                <label class="bpm-label">
                    BPM
                    <input id="seq-bpm" type="range" min="60" max="180" value="110">
                    <span id="seq-bpm-val">110</span>
                </label>
            </div>
            <div class="seq-row" data-track="kick">
                <span class="seq-name">KICK</span>
                <div class="seq-steps" id="seq-kick"></div>
            </div>
            <div class="seq-row" data-track="hat">
                <span class="seq-name">HAT</span>
                <div class="seq-steps" id="seq-hat"></div>
            </div>
        </div>
        <p class="midi-status" id="midi-status">MIDI: not connected</p>
    </main>
    <script src="script.js"></script>
</body>

</html>
